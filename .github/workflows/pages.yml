name: Validate and deploy Block City

# Manual only. Place this project at the root of its own repository before enabling Pages.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: block-city-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_CHANNEL: chromium
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
